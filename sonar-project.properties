sonar.projectName=Cafe Creencia (Next.js)
sonar.projectKey=
sonar.organization=

# Código a analizar
sonar.sources=app,components,lib,middleware.ts
sonar.tests=tests

# Excluye generados, vendor y herramientas (no análisis útil)
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/build/**,**/dist/**,agy2-pprojects/**,.agents/**,.kiro/**,docs/**,**/*.test.ts,**/*.test.tsx
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# TypeScript: usa el tsconfig del proyecto (rutas @/ y aliases)
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.sourceEncoding=UTF-8

# Cobertura (opcional, si generas coverage/lcov.info)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# UI client sin tests unitarios (excluida del cálculo del gate de cobertura)
sonar.coverage.exclusions=**/*-client.tsx,**/ui/*.tsx,**/site/header.tsx,app/login/page.tsx

# Reglas: calidad + seguridad/core (Community no incluye taint/SAST avanzado)
sonar.java.binaries=